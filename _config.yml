# Mylemans Online: main site + blog, built with Jekyll, served by Express.
# Posts keep the same permalinks they had on blog.mylemans.online so that
# backlinks and giscus comment threads (mapped by pathname) survive the move.

title: Mylemans Online
tagline: 14 years of IT, documented in public.
description: >-
  IT tutorials and war stories from 14 years of systems engineering: Proxmox,
  Hyper-V, Windows Server, Microsoft 365. Plus free hands-on learning at Mylemans Labs.
url: "https://mylemans.online"
baseurl: ""
lang: en
timezone: Europe/Brussels

author:
  name: Marc Mylemans
  email: info@mylemans.online
  twitter: mylemansonline

social:
  name: Marc Mylemans
  links:
    - https://www.youtube.com/@mylemansonline
    - https://github.com/marcmylemans
    - https://www.linkedin.com/in/marc-mylemans-887567b9/
    - https://bsky.app/profile/mylemans.online

logo: /assets/img/logo-light.png
default_image: /assets/img/posts/Default.jpg

# Comments (giscus), carried over from the blog. Mapping is by pathname, so
# existing threads keep working as long as /posts/:title/ does not change.
comments:
  active: giscus
  giscus:
    repo: marcmylemans/marcmylemans.github.io
    repo_id: R_kgDOItNOFw
    category: Announcements
    category_id: DIC_kwDOItNOF84CeB7v
    mapping: pathname
    input_position: top

# Google AdSense. Ads appear only on pages that use the default layout (posts,
# blog index, category and tag pages); the homepage and the standalone pages
# (about, services, sponsor, ...) have their own <head> and never load the script.
# Consent for ads is handled by Google's own GDPR message (AdSense > Privacy &
# messaging, published for mylemans.online), which adsbygoogle.js shows itself.
# Auto ads are OFF in the AdSense console, so only the slots below render.
adsense:
  enabled: true
  client: ca-pub-2763620817485009
  in_article_slot: "6267293701"   # unit "mylemans-online_page_body_Blog1" (display, responsive)
  in_article: true                # one slot after the second H2 of longer posts
  end_of_post: true               # one more slot after the article body
  list_slot: "9203598175"         # unit "mylemans-online_sidebar_bottom_AdSense3": between blog-index rows
  list_after: 4                   # insert the list slot after this many rows on /blog/

# Blog index at /blog/, 10 posts per page
paginate: 10
paginate_path: "/blog/page:num/"


markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-youtube
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-toc

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

feed:
  path: feed.xml
  posts_limit: 20

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

sass:
  style: compressed

exclude:
  - node_modules
  - server.js
  - package.json
  - package-lock.json
  - dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .dockerignore

toc:
  min_level: 2
  max_level: 3
  no_toc_section_class: no_toc_section
  list_class: toc
