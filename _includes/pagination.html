{%- if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {%- if paginator.previous_page %}
  <a class="btn btn-ghost" href="{{ paginator.previous_page_path }}">&larr; Newer</a>
  {%- else %}<span></span>{% endif %}
  <span class="pagination-status">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
  {%- if paginator.next_page %}
  <a class="btn btn-ghost" href="{{ paginator.next_page_path }}">Older &rarr;</a>
  {%- else %}<span></span>{% endif %}
</nav>
{%- endif %}
