<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ '/assets/img/logo-light.png' | relative_url }}" alt="" width="32" height="32" class="brand-logo brand-logo-light" />
      <img src="{{ '/assets/img/logo-dark.png' | relative_url }}" alt="" width="32" height="32" class="brand-logo brand-logo-dark" />
      <span class="brand-text">Mylemans Online</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="nav" id="site-nav" aria-label="Main navigation">
      <button class="nav-close" type="button" aria-label="Close menu">✕</button>

      <ul class="nav-list">
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' or page.layout == 'category' or page.layout == 'tag' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="https://labs.mylemans.online" target="_blank" rel="noreferrer">Labs</a></li>
        <li><a href="{{ '/projects.html' | relative_url }}"{% if page.url == '/projects.html' or page.url == '/hardware.html' %} aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="https://www.youtube.com/@mylemansonline" target="_blank" rel="noreferrer">YouTube</a></li>
        <li><a href="{{ '/about.html' | relative_url }}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/#newsletter' | relative_url }}">Newsletter</a></li>
      </ul>

      <a href="{{ '/blog/#search' | relative_url }}" class="nav-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span class="nav-search-label">Search the blog</span>
      </a>

      <button class="btn btn-ghost theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
        <span class="theme-toggle-icon theme-toggle-icon-light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="theme-toggle-icon theme-toggle-icon-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>

      <a href="https://labs.mylemans.online" class="btn btn-primary header-cta" target="_blank" rel="noreferrer">
        Start learning, free
      </a>
    </nav>
  </div>
</header>
