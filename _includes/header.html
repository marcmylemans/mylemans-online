<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ '/assets/img/logo-light.png' | relative_url }}" alt="Mylemans Online" class="brand-logo brand-logo-light" />
      <img src="{{ '/assets/img/logo-dark.png' | relative_url }}" alt="Mylemans Online" class="brand-logo brand-logo-dark" />
      <span class="brand-text">Mylemans Online</span>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="nav" aria-label="Main navigation">
      <button class="nav-close" type="button" aria-label="Close menu">✕</button>

      <ul class="nav-list">
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' or page.layout == 'category' or page.layout == 'tag' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="https://labs.mylemans.online" target="_blank" rel="noreferrer">Labs</a></li>
        <li><a href="{{ '/projects.html' | relative_url }}"{% if page.url == '/projects.html' or page.url == '/hardware.html' %} aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="https://www.youtube.com/@mylemansonline" target="_blank" rel="noreferrer">YouTube</a></li>
        <li><a href="{{ '/about.html' | relative_url }}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/#newsletter' | relative_url }}">Newsletter</a></li>
      </ul>

      <a href="{{ '/blog/#search' | relative_url }}" class="nav-search" aria-label="Search the blog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </a>

      <button class="btn btn-ghost theme-toggle" type="button" aria-label="Toggle color theme">
        <span class="theme-toggle-icon theme-toggle-icon-light">☀️</span>
        <span class="theme-toggle-icon theme-toggle-icon-dark">🌙</span>
      </button>

      <a href="https://labs.mylemans.online" class="btn btn-primary header-cta" target="_blank" rel="noreferrer">
        Start learning, free
      </a>
    </nav>
  </div>
</header>
